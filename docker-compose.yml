# QuickBank local stack.
# Ports: app 8088, Keycloak 8080, Kafka UI 8085, Grafana 3000, MySQL 3306, Kafka host 9092, OTLP 4317/4318, Jaeger UI 16686.
name: quickbank

services:
  mysql:
    image: mysql:8.4.13
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    environment:
      MYSQL_DATABASE: quickbank
      MYSQL_USER: quickbank
      MYSQL_PASSWORD: quickbank
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    volumes:
      - quickbank-mysql:/var/lib/mysql

  kafka:
    image: apache/kafka:3.9.2
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./docker/keycloak/quickbank-realm.json:/opt/keycloak/data/import/quickbank-realm.json:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 45s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./docker/otel/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - jaeger
      - tempo

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"

  kafka-ui:
    image: kafbat/kafka-ui:v1.2.0
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: quickbank
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "false"
    depends_on:
      kafka:
        condition: service_healthy

  tempo:
    image: grafana/tempo:2.7.2
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./docker/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - quickbank-tempo:/var/tempo

  loki:
    image: grafana/loki:3.4.2
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./docker/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - quickbank-loki:/loki

  alloy:
    image: grafana/alloy:v1.7.5
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.6.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - tempo
      - loki
      - jaeger

  app:
    build: .
    ports:
      - "8088:8088"
    environment:
      SERVER_PORT: "8088"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/quickbank?characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      SPRING_DATASOURCE_USERNAME: quickbank
      SPRING_DATASOURCE_PASSWORD: quickbank
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      QUICKBANK_ISSUER: http://localhost:8080/realms/quickbank
      QUICKBANK_JWK_SET_URI: http://keycloak:8080/realms/quickbank/protocol/openid-connect/certs
      KEYCLOAK_CLIENT_ID: quickbank-web
      KEYCLOAK_CLIENT_SECRET: quickbank-web-secret
      KEYCLOAK_AUTHORIZATION_URI: http://localhost:8080/realms/quickbank/protocol/openid-connect/auth
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/quickbank/protocol/openid-connect/token
      KEYCLOAK_USERINFO_URI: http://keycloak:8080/realms/quickbank/protocol/openid-connect/userinfo
      OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
      DT_TENANT: ${DT_TENANT:-}
      DT_API_TOKEN: ${DT_API_TOKEN:-}
      DT_OTLP_ENDPOINT: ${DT_OTLP_ENDPOINT:-}
      QUICKBANK_CREDIT_LIMIT: ${QUICKBANK_CREDIT_LIMIT:-2000.00}
      QUICKBANK_PAYMENT_MOCK_DELAY_MS: ${QUICKBANK_PAYMENT_MOCK_DELAY_MS:-750}
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8088/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    restart: on-failure

volumes:
  quickbank-mysql:
  quickbank-tempo:
  quickbank-loki:
